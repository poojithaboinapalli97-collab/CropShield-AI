<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background field gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="40%" stop-color="#166534" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Early Blight Lesion Gradient (Concentric Rings) -->
    <radialGradient id="lesionGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="35%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#92400e" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lesionGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#291102" />
      <stop offset="30%" stop-color="#5a2308" />
      <stop offset="65%" stop-color="#854d0e" />
      <stop offset="88%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>

    <!-- Scan Grid Effect -->
    <pattern id="scanGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Farm background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <rect width="600" height="400" fill="url(#scanGrid)" />

  <!-- Botanical Leaf Structure -->
  <g transform="translate(300, 200) rotate(-10)">
    <!-- Main Leaf Body -->
    <path d="M 0 -170 
             C 70 -140, 150 -80, 165 0 
             C 180 80, 120 145, 0 175 
             C -120 145, -180 80, -165 0 
             C -150 -80, -70 -140, 0 -170 Z" 
          fill="url(#leafGrad)" 
          stroke="#166534" 
          stroke-width="3"
          filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))" />

    <!-- Leaf Serrated Lobes -->
    <path d="M 0 -170 Q 35 -130 50 -100 Q 80 -105 110 -75 Q 130 -40 160 -10 Q 140 30 145 60 Q 110 85 90 120 Q 40 140 0 175 Q -40 140 -90 120 Q -110 85 -145 60 Q -140 30 -160 -10 Q -130 -40 -110 -75 Q -80 -105 -50 -100 Q -35 -130 0 -170 Z"
          fill="url(#leafGrad)" opacity="0.85" />

    <!-- Central Vein -->
    <path d="M 0 -165 Q 5 0 0 170" stroke="#86efac" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Lateral Veins -->
    <path d="M 0 -110 Q 40 -85 95 -70" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 -110 Q -40 -85 -95 -70" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 -50 Q 55 -30 135 -10" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 -50 Q -55 -30 -135 -10" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 15 Q 50 40 125 65" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 15 Q -50 40 -125 65" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 75 Q 40 100 80 125" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 0 75 Q -40 100 -80 125" stroke="#86efac" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Alternaria Solani Concentric Lesions (Target Spots) -->
    <!-- Lesion 1 (Center-right) -->
    <circle cx="45" cy="-25" r="32" fill="url(#lesionGrad1)" />
    <circle cx="45" cy="-25" r="24" fill="none" stroke="#5a2308" stroke-width="1.8" opacity="0.7" />
    <circle cx="45" cy="-25" r="16" fill="none" stroke="#3b1503" stroke-width="1.8" opacity="0.8" />
    <circle cx="45" cy="-25" r="8" fill="#1f0901" />

    <!-- Lesion 2 (Lower-left) -->
    <circle cx="-55" cy="45" r="38" fill="url(#lesionGrad2)" />
    <circle cx="-55" cy="45" r="28" fill="none" stroke="#78350f" stroke-width="2" opacity="0.75" />
    <circle cx="-55" cy="45" r="18" fill="none" stroke="#451a03" stroke-width="1.8" opacity="0.85" />
    <circle cx="-55" cy="45" r="9" fill="#1f0901" />

    <!-- Lesion 3 (Upper-left small spot) -->
    <circle cx="-40" cy="-85" r="20" fill="url(#lesionGrad1)" />
    <circle cx="-40" cy="-85" r="12" fill="none" stroke="#5a2308" stroke-width="1.5" />
    <circle cx="-40" cy="-85" r="5" fill="#291102" />

    <!-- Lesion 4 (Mid-right edge spot) -->
    <circle cx="85" cy="30" r="25" fill="url(#lesionGrad2)" />
    <circle cx="85" cy="30" r="15" fill="none" stroke="#78350f" stroke-width="1.5" />
    <circle cx="85" cy="30" r="6" fill="#1f0901" />

    <!-- YOLO Bounding Box 1 around primary lesion -->
    <rect x="0" y="-70" width="90" height="90" rx="8" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6,4" />
    <g transform="translate(0, -78)">
      <rect width="90" height="18" rx="4" fill="#16a34a" />
      <text x="45" y="13" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Alternaria 96%</text>
    </g>

    <!-- YOLO Bounding Box 2 around lower lesion -->
    <rect x="-105" y="-3" width="102" height="98" rx="8" fill="none" stroke="#eab308" stroke-width="2.5" stroke-dasharray="6,4" />
    <g transform="translate(-105, -11)">
      <rect width="102" height="18" rx="4" fill="#ca8a04" />
      <text x="51" y="13" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Early Blight 94%</text>
    </g>
  </g>

  <!-- AI Radar Scanning Line Animation effect -->
  <line x1="0" y1="210" x2="600" y2="210" stroke="#4ade80" stroke-width="2" opacity="0.65" />
  <rect x="0" y="195" width="600" height="30" fill="url(#bgGrad)" opacity="0.15" />

  <!-- Live Telemetry Watermark -->
  <g transform="translate(20, 30)">
    <circle cx="8" cy="8" r="5" fill="#22c55e" />
    <text x="22" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dcfce7" letter-spacing="0.5">YOLOv8 PRECISION AGRI-VISION • ACTIVE SCAN</text>
  </g>
</svg>
