services:
  # ------------------------------------------------------------------
  # 1. FLASK PYTHON ML BACKEND (Render Web Service)
  # ------------------------------------------------------------------
  - type: web
    name: cropshield-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.12

  # ------------------------------------------------------------------
  # 2. REACT + VITE FRONTEND (Render Static Site)
  # ------------------------------------------------------------------
  - type: web
    name: cropshield-ai-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cropshield-ai-backend
          property: host
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cropshield-ai-backend
          property: host
